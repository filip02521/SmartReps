<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kod logowania SmartReps</title>
  </head>
  <body style="margin:0;padding:0;background:#0f1115;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eaed;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0f1115;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px;background:#171a21;border:1px solid #2a2f3a;border-radius:12px;padding:28px 24px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#9aa3b2;">SmartReps</p>
                <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#ffffff;font-weight:700;">Twój kod logowania</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#c5cad3;">
                  Wpisz ten 6-cyfrowy kod w aplikacji SmartReps:
                </p>
                <p style="margin:0 0 24px;text-align:center;font-size:36px;line-height:1.2;font-weight:700;letter-spacing:0.28em;color:#ffffff;font-variant-numeric:tabular-nums;">
                  {{ .Token }}
                </p>
                <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#9aa3b2;">
                  Kod jest ważny przez godzinę i działa tylko raz. Jeśli to nie Ty prosiłeś o logowanie — zignoruj tę wiadomość.
                </p>
                <p style="margin:16px 0 0;font-size:12px;line-height:1.5;color:#6b7380;">
                  Nadawca: SmartReps · SR@ontime.mikran.pl
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
