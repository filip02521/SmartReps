<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sr-mask-grad" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="sr-mask-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect width="512" height="512" fill="#09090B"/>
  <g transform="translate(256 256)">
    <!-- Smaller ring — within safe zone (80% of canvas) -->
    <circle cx="0" cy="0" r="130" stroke="url(#sr-mask-grad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 0 -114 A 114 114 0 0 1 114 0" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" opacity="0.5" fill="none"/>
    <text x="0" y="44" text-anchor="middle" fill="url(#sr-mask-grad)" font-size="124" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif" filter="url(#sr-mask-glow)">R</text>
  </g>
</svg>
