    <text x="0" y="56" text-anchor="middle" fill="url(#sr-aim-grad)" font-size="160" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif" filter="url(#sr-aim-glow)">R</text>
  </g>
</svg>
