<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366F1" id="sr-theme-color" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Inteligentne śledzenie treningu pompek i podciągania — SmartReps" />
    <meta property="og:title" content="SmartReps" />
    <meta property="og:description" content="Inteligentne śledzenie treningu pompek i podciągania" />
    <meta property="og:image" content="https://smart-reps.vercel.app/brand/icon-512.png" />
    <meta property="og:url" content="https://smart-reps.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://smart-reps.vercel.app/brand/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartReps" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>SmartReps</title>
    <style>
      /* Boot paint before CSS vars. Respect data-theme so forced dark ≠ light OS. */
      html, body { margin: 0; min-height: 100%; background: #09090b; }
      html[data-theme='light'], html[data-theme='light'] body {
        background: #fafafa;
      }
      html[data-theme='dark'], html[data-theme='dark'] body {
        background: #09090b;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]), html:not([data-theme]) body {
          background: #fafafa;
        }
        html:not([data-theme]) #sr-boot-splash { background: #fafafa; }
        html:not([data-theme]) #sr-boot-splash .mark { border-color: #6366f1; color: #6366f1; }
      }
      html[data-theme='light'] #sr-boot-splash { background: #fafafa; }
      html[data-theme='light'] #sr-boot-splash .mark { border-color: #6366f1; color: #6366f1; }
      #sr-boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #09090b;
        transition: opacity 0.25s ease;
      }
      #sr-boot-splash[data-hide="1"] { opacity: 0; pointer-events: none; }
      #sr-boot-splash .mark {
        width: 56px; height: 56px; border-radius: 50%;
        border: 3px dashed #6366f1;
        display: flex; align-items: center; justify-content: center;
        color: #6366f1;
        font: 700 22px 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="sr-boot-splash" aria-hidden="true"><div class="mark">R</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
