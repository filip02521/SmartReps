    <style>
      /* Boot paint before CSS vars. Respect data-theme so forced dark ≠ light OS. */
      html, body { margin: 0; min-height: 100%; background: #09090b; }
      html[data-theme='light'], html[data-theme='light'] body {
        background: #fafafa;
      }
      html[data-theme='dark'], html[data-theme='dark'] body {
        background: #09090b;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]), html:not([data-theme]) body {
          background: #fafafa;
        }
        html:not([data-theme]) #sr-boot-splash { background: #fafafa; }
      }
      html[data-theme='light'] #sr-boot-splash { background: #fafafa; }
      #sr-boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px;
        background: #09090b;
        transition: opacity 0.3s ease;
      }
      #sr-boot-splash[data-hide="1"] { opacity: 0; pointer-events: none; }
      #sr-boot-splash .mark {
        animation: sr-boot-breathe 2.4s ease-in-out infinite;
      }
      #sr-boot-splash .wordmark {
        font: 700 18px 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        letter-spacing: -0.02em;
        color: #fafafa;
      }
      html[data-theme='light'] #sr-boot-splash .wordmark { color: #18181b; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) #sr-boot-splash .wordmark { color: #18181b; }
      }
      #sr-boot-splash .wordmark .accent {
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes sr-boot-breathe {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 0.95; }
      }
    </style>
  </head>
  <body>
    <div id="sr-boot-splash" aria-hidden="true">
      <svg class="mark" width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boot-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1"/>
            <stop offset="0.55" stop-color="#6366F1"/>
            <stop offset="1" stop-color="#22D3EE"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#boot-grad)"/>
        <rect x="13" y="37" width="9" height="8" rx="3" fill="white"/>
        <rect x="27.5" y="29" width="9" height="16" rx="3" fill="white"/>
        <rect x="42" y="19" width="9" height="26" rx="3" fill="white"/>
      </svg>
      <div class="wordmark">Smart<span class="accent">Reps</span></div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const guardKey = 'sr-boot-recovery-count'
        let recovering = false
        const recover = async () => {
          if (recovering || document.getElementById('root')?.hasChildNodes()) return
          recovering = true
          let count = 0
          try { count = Number(sessionStorage.getItem(guardKey) || 0) } catch {}
          if (count >= 2 || !navigator.onLine) return
          try { sessionStorage.setItem(guardKey, String(count + 1)) } catch {}
          try {
            const registrations = await navigator.serviceWorker?.getRegistrations?.() || []
            await Promise.allSettled(registrations.map((registration) => registration.update()))
            registrations.forEach((registration) => {
              registration.waiting?.postMessage({ type: 'SKIP_WAITING' })
            })
            if ('caches' in window) {
              const keys = await caches.keys()
              await Promise.allSettled(
                keys
                  .filter((key) => key.includes('precache') || key === 'sr-navigations')
                  .map((key) => caches.delete(key)),
              )
            }
          } catch {}
          window.setTimeout(() => {
            window.location.replace(`/?__sr_recover=${Date.now()}`)
          }, 500)
        }
        window.addEventListener('error', (event) => {
          if (event.target instanceof HTMLScriptElement) void recover()
        }, true)
        window.setTimeout(() => void recover(), 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
