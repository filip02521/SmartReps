      VITE_SUPABASE_URL: https://epjtnhsqzgtjhghzqefx.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwanRuaHNxemd0amhnaHpxZWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTYyNDMsImV4cCI6MjEwNDYzMjI0M30.pH40dG9Pn5OpcFSAJ0OqL7j02Z3W8svU_clfVdZRkoY
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom@30 requires Node ^22.22.2 || ^24.15.0 || >=26
